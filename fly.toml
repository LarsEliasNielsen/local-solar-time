# fly.toml app configuration file generated for local-solar-time on 2026-10-17T02:35:49+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'local-solar-time'
primary_region = 'arn'

# Matches shutdownTimeout in main.go; Fly sends SIGINT, then kills after this.
kill_timeout = 10

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Each open tab holds one WebSocket connection.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
